<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Logs</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-color: #333;
            --text-muted: #777;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .back-link {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 600;
            font-size: 0.9rem;
        }

        h1 { margin: 0; font-size: 1.5rem; color: var(--primary-color); }

        .filter-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            background: #f9fbff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #eef2f7;
        }

        input[type="text"], select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        .btn-search {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .list { list-style: none; padding: 0; }
        .item {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        .item:last-child { border-bottom: none; }
        .description { font-weight: 500; display: block; margin-bottom: 4px; }
        .meta { font-size: 0.8rem; color: var(--text-muted); }

        .no-results {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-link">← Back</a>
            <h1>Task Logs</h1>
        </div>

        <form class="filter-form" action="/task_logs" method="get">
            <div style="display: flex; gap: 10px;">
                <select name="date" style="flex: 1;">
                    <option value="">All Dates</option>
                    {% for date in available_dates %}
                        <option value="{{ date }}" {% if date == selected_date %}selected{% endif %}>{{ date }}</option>
                    {% endfor %}
                </select>
                <input type="text" name="q" placeholder="Search tasks..." value="{{ search_query }}" style="flex: 2;">
            </div>
            <button type="submit" class="btn-search">Search / Filter</button>
        </form>

        <div class="list">
            {% if logs %}
                {% for log in logs %}
                    <div class="item">
                        <span class="description">{{ log.description }}</span>
                        <span class="meta">📅 {{ log.date }} | 🕒 {{ log.logged_at }}</span>
                    </div>
                {% endfor %}
            {% else %}
                <p class="no-results">No logged tasks found.</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
